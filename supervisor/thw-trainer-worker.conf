; =============================================================================
; THW-Trainer Queue Worker - Supervisor Konfiguration
; =============================================================================
;
; SETUP:
;   1. Platzhalter ersetzen:
;      - SITE_USER: thw-trainer-dev (DEV) oder thw-trainer-prod (PROD)
;      - DOMAIN:    dev.thw-trainer.de (DEV) oder thw-trainer.de (PROD)
;
;   2. Config nach /etc/supervisor/conf.d/ kopieren:
;      sudo cp supervisor/thw-trainer-worker.conf /etc/supervisor/conf.d/thw-trainer-worker.conf
;
;   3. Supervisor neu laden:
;      sudo supervisorctl reread
;      sudo supervisorctl update
;      sudo supervisorctl start thw-trainer-worker
;
;   4. Status prüfen:
;      sudo supervisorctl status thw-trainer-worker
;
; LOGS: /home/SITE_USER/htdocs/DOMAIN/storage/logs/worker.log
; =============================================================================

[program:thw-trainer-worker]
command=/usr/bin/php8.5 /home/SITE_USER/htdocs/DOMAIN/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/home/SITE_USER/htdocs/DOMAIN
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=SITE_USER
numprocs=1
redirect_stderr=true
stdout_logfile=/home/SITE_USER/htdocs/DOMAIN/storage/logs/worker.log
stopwaitsecs=3600
