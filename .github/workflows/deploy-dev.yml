name: Deploy DEV

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/thw-trainer-dev/htdocs/dev.thw-trainer.de

            # 1. Wartungsmodus aktivieren
            php artisan down

            # 2. Lokale Änderungen verwerfen (npm run build erzeugt Diffs in public/build/)
            git checkout -- .
            git clean -fd public/build/assets/ temp/

            # 3. Code updaten
            git pull origin dev
            
            # 3. Composer Dependencies
            composer install --no-dev --optimize-autoloader
            
            # 4. NPM Assets bauen (falls du JS/CSS hast)
            npm ci
            npm run build
            
            # 5. Storage Symlinks
            php artisan storage:link
            
            # 6. Datenbank migrieren
            php artisan migrate --force
            
            # 7. Caches leeren & neu bauen
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # 8. Wartungsmodus deaktivieren
            php artisan up