name: Deploy PROD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # ermöglicht manuelle Bestätigung in GitHub
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/thw-trainer/htdocs/thw-trainer.de

            # 0. Trap: Bei Fehler Wartungsmodus wieder deaktivieren
            trap 'php artisan up || true' ERR

            # 1. Wartungsmodus aktivieren
            php artisan down

            # 2. Remote holen und hart auf origin/main resetten
            #    (ersetzt git checkout -- . + git clean + git pull - robuster, hängt nicht)
            git fetch origin main
            git reset --hard origin/main
            git clean -fd public/build/assets/ temp/
            
            # 3. Composer Dependencies
            composer install --no-dev --optimize-autoloader
            
            # 4. NPM Assets bauen (falls du JS/CSS hast)
            npm ci
            npm run build
            
            # 5. Storage Symlinks
            php artisan storage:link
            
            # 6. Datenbank migrieren
            php artisan migrate --force
            
            # 7. Caches leeren & neu bauen
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # 8. Wartungsmodus deaktivieren
            php artisan up