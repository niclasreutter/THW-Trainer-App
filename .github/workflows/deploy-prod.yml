name: Deploy PROD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # ermöglicht manuelle Bestätigung in GitHub
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /home/thw-trainer-prod/htdocs/thw-trainer.de
            # 1. Wartungsmodus aktivieren
            php artisan down
            
            # 2. Code updaten
            git pull origin main
            
            # 3. Composer Dependencies
            composer install --no-dev --optimize-autoloader
            
            # 4. NPM Assets bauen (falls du JS/CSS hast)
            npm ci
            npm run build
            
            # 5. Storage Symlinks
            php artisan storage:link
            
            # 6. Datenbank migrieren
            php artisan migrate --force
            
            # 7. Caches leeren & neu bauen
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # 8. Wartungsmodus deaktivieren
            php artisan up